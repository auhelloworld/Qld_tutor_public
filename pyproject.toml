[project]
name = "ai-tutoring"
version = "2.0.0"
description = "QLD AI Tutoring System — Curriculum-Grounded, Rule-Based"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn>=0.30",
    "openai>=1.0",
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0",
    "python-multipart>=0.0.9",
    "PyYAML>=6.0",
    "httpx>=0.27",
    "sympy>=1.12",
    "python-dotenv>=1.0.0",
    "bcrypt>=4.1.0",
]

[project.optional-dependencies]
dev = [
    "watchfiles>=1.0.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "freezegun>=1.4",
    "mutmut>=2.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["backend*", "core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "fast: Fast deterministic tests for the default developer loop",
    "unit: Unit tests",
    "property: Property-based tests (Hypothesis)",
    "integration: Integration tests (TestClient)",
    "content_audit: Full-bank content and auditor regression gates",
    "full_data: Tests that require a private copy of authored data files",
    "slow: Tests that exceed 1s",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--strict-markers -ra"

[tool.mutmut]
paths_to_mutate = "backend/"
tests_dir = "tests/"
runner = "python -m pytest tests/ -x -q --hypothesis-profile=nightly"

# Mutation testing target: 80% kill-rate on these five safety-critical functions:
# - backend.rules.StudyRuleEngine.calculate_bkt
# - backend.rules.StudyRuleEngine.recommend_next_topic
# - backend.answer_normalize.normalise
# - backend.answer_redact.redact
# - backend.variation_verify.verify
